// Modified for firebase-emu: reduced to the wire-compatible subset used here.

syntax = "proto3";
package google.firestore.v1;

import "google/firestore/v1/document.proto";
import "google/protobuf/wrappers.proto";

message StructuredQuery {
  Projection select = 1;
  repeated CollectionSelector from = 2;
  Filter where = 3;
  repeated Order order_by = 4;
  google.protobuf.Int32Value limit = 5;
  int32 offset = 6;
  Cursor start_at = 7;
  Cursor end_at = 8;

  message CollectionSelector {
    string collection_id = 2;
    bool all_descendants = 3;
  }
  message Projection { repeated FieldReference fields = 2; }
  message FieldReference { string field_path = 2; }
  message Filter {
    oneof filter_type { CompositeFilter composite_filter = 1; FieldFilter field_filter = 2; UnaryFilter unary_filter = 3; }
  }
  message CompositeFilter {
    enum Operator { OPERATOR_UNSPECIFIED = 0; AND = 1; OR = 2; }
    Operator op = 1;
    repeated Filter filters = 2;
  }
  message FieldFilter {
    enum Operator { OPERATOR_UNSPECIFIED = 0; LESS_THAN = 1; LESS_THAN_OR_EQUAL = 2; GREATER_THAN = 3; GREATER_THAN_OR_EQUAL = 4; EQUAL = 5; NOT_EQUAL = 6; ARRAY_CONTAINS = 7; IN = 8; ARRAY_CONTAINS_ANY = 9; NOT_IN = 10; }
    FieldReference field = 1; Operator op = 2; Value value = 3;
  }
  message UnaryFilter {
    enum Operator { OPERATOR_UNSPECIFIED = 0; IS_NAN = 2; IS_NULL = 3; IS_NOT_NAN = 4; IS_NOT_NULL = 5; }
    Operator op = 1; oneof operand_type { FieldReference field = 2; }
  }
  enum Direction { DIRECTION_UNSPECIFIED = 0; ASCENDING = 1; DESCENDING = 2; }
  message Order { FieldReference field = 1; Direction direction = 2; }
  message Cursor {
    repeated Value values = 1;
    bool before = 2;
  }
}
