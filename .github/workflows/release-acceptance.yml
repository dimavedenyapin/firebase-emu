name: Published release acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/release-acceptance.yml'
      - 'scripts/accept-published-release.py'
      - 'scripts/package-release-smoke.py'
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to test
        default: v0.1.4
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Published archive (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          check-latest: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          check-latest: false
      - name: Record runtime versions
        shell: bash
        run: |
          node --version
          python --version
      - name: Test downloaded published archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v0.1.4' }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONSAFEPATH: '1'
        run: |
          node_path="$(node -p 'process.execPath')"
          python scripts/accept-published-release.py \
            --tag "$RELEASE_TAG" \
            --target "${{ matrix.target }}" \
            --node "$node_path"
