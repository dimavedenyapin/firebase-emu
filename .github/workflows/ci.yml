name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Rust and Functions checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions-runtime/package-lock.json
      - name: Install Functions test dependencies
        run: npm ci --ignore-scripts --prefix functions-runtime
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust targets
        run: cargo check --locked --all-targets
      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --no-deps
      - name: Test Rust targets
        run: cargo test --locked --all-targets
      - name: Test Functions adapter
        run: npm test --prefix functions-runtime
