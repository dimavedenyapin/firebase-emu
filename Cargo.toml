[package]
name = "firebase-emu"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
axum07 = { package = "axum", version = "0.7" }
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
fs2 = "0.4"
libc = "0.2"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.12"
tower-http = { version = "0.6", features = ["cors"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
